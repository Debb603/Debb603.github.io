<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deborah Monday | Cybersecurity Analyst</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0f1c;
            color: #ffffff;
            line-height: 1.6;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: #0a0f1c;
            border-bottom: 1px solid #1e293b;
        }

        nav h2 {
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            padding: 80px 8%;
        }

        .hero-text {
            max-width: 650px;
        }

        .hero-text p:first-child {
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero h3 {
            font-size: 25px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .hero p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 22px;
            margin-right: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .primary {
            background: #38bdf8;
            color: #020617;
        }

        .secondary {
            border: 1px solid #38bdf8;
            color: #38bdf8;
        }

        .profile {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
        }

        section {
            padding: 80px 8%;
        }

        section h2 {
            font-size: 35px;
            margin-bottom: 25px;
            color: #38bdf8;
        }

        .about {
            background: #0f172a;
        }

        .about p {
            max-width: 800px;
            color: #cbd5e1;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .project {
            background: #111827;
            padding: 25px;
            border: 1px solid #1e293b;
            border-radius: 10px;
        }

        .project h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .project p {
            color: #94a3b8;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 10px 16px;
            border-radius: 20px;
        }

        .contact {
            text-align: center;
            background: #0f172a;
        }

        .contact a {
            color: #38bdf8;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
            }
        }
